<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="d3_arr3" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#185fa5"></path>
</marker>
</defs>
<text fill="#0c447c" font-size="16" font-weight="600" text-anchor="middle" x="340" y="28">J-ST three-layer architecture and mint/redeem flow</text>
 L1 Physical Layer 
<rect fill="#eaf3de" height="60" rx="8" stroke="#3b6d11" stroke-width="1.5" width="640" x="20" y="60"></rect>
<text fill="#27500a" font-size="13" font-weight="600" x="40" y="86">L1 Physical Layer</text>
<text fill="#27500a" font-size="11" x="40" y="106">1 MJ physical constant (never changes)</text>
<text fill="#27500a" font-size="11" font-style="italic" text-anchor="end" x="600" y="86">Anchor asset</text>
 L2 Collateral Layer 
<rect fill="#fff3cd" height="60" rx="8" stroke="#d39e00" stroke-width="1.5" width="640" x="20" y="140"></rect>
<text fill="#6b5400" font-size="13" font-weight="600" x="40" y="166">L2 Collateral Layer</text>
<text fill="#6b5400" font-size="11" x="40" y="186">BTC (decentralized custody) valued at physical floor price P_floor → CR ≥ 140%</text>
<text fill="#6b5400" font-size="11" font-style="italic" text-anchor="end" x="600" y="166">Collateral</text>
 L3 Transaction Layer 
<rect fill="#e6f1fb" height="60" rx="8" stroke="#185fa5" stroke-width="1.5" width="640" x="20" y="220"></rect>
<text fill="#0c447c" font-size="13" font-weight="600" x="40" y="246">L3 Transaction Layer</text>
<text fill="#0c447c" font-size="11" x="40" y="266">1 J-ST ≡ 1 MJ (arbitrage maintains the peg)</text>
<text fill="#0c447c" font-size="11" font-style="italic" text-anchor="end" x="600" y="246">Medium of exchange</text>
<!-- Mint/Redeem arrows -->
<text fill="#27500a" font-size="12" font-weight="600" text-anchor="middle" x="200" y="330">Mint</text>
<text fill="#27500a" font-size="10" text-anchor="middle" x="200" y="345">Lock BTC → mint J-ST</text>
<line marker-end="url(#d3_arr3)" stroke="#3b6d11" stroke-width="1.5" x1="200" x2="200" y1="280" y2="318"></line>
<text fill="#791f1f" font-size="12" font-weight="600" text-anchor="middle" x="500" y="330">Redeem</text>
<text fill="#791f1f" font-size="10" text-anchor="middle" x="500" y="345">Burn J-ST → redeem BTC</text>
<line marker-end="url(#d3_arr3)" stroke="#a32d2d" stroke-width="1.5" x1="500" x2="500" y1="318" y2="280"></line>
</svg>