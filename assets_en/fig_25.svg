<svg role="img" style="font-family:'Segoe UI','Microsoft YaHei',sans-serif" viewBox="0 0 680 380" width="100%">
<title>The two-layer structure of J-ST's unit of account and joule anchor</title>
<desc>Given the joule anchor, the unit of account may carry a USD label; the floating USD serves only as a real-time reference display and cannot be the anchor.</desc>
<defs>
<marker id="d4_arr3" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="8" refy="5" viewBox="0 0 10 10">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185fa5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="d4_arr3r" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="8" refy="5" viewBox="0 0 10 10">
<path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<text fill="#2c2c2a" font-size="15" font-weight="500" text-anchor="middle" x="340" y="26">Unit of account and anchor: two-layer structure</text>
<text fill="#5f5e5a" font-size="12" text-anchor="middle" x="340" y="46">J-ST anchors to the joule; USD is only a denomination label / floating reference and bears no anchoring</text>
<rect fill="#eaf3de" height="72" rx="8" stroke="#3b6d11" stroke-width="1.5" width="250" x="50" y="288"></rect>
<text fill="#27500a" font-size="14" font-weight="500" text-anchor="middle" x="175" y="312">① Physical anchor · joule</text>
<text fill="#2c2c2a" font-size="12" text-anchor="middle" x="175" y="334">P<tspan dy="3" font-size="9">floor</tspan>(marginal energy cost)</text>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="175" y="350">derived from difficulty D + efficiency η, provable on-chain</text>
<rect fill="#e6f1fb" height="78" rx="8" stroke="#185fa5" stroke-width="1.5" width="250" x="50" y="96"></rect>
<text fill="#0c447c" font-size="14" font-weight="500" text-anchor="middle" x="175" y="120">② Unit of account J-ST</text>
<text fill="#2c2c2a" font-size="12" text-anchor="middle" x="175" y="142">1 J-ST = 1 MJ (may carry a "$" label)</text>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="175" y="160">Users perceive only this layer; value is fixed to the joule</text>
<line marker-end="url(#d4_arr3)" stroke="#185fa5" stroke-width="1.5" x1="175" x2="175" y1="174" y2="286"></line>
<text fill="#185fa5" font-size="11" x="190" y="222">1:1 fixed convertibility</text>
<text fill="#185fa5" font-size="11" x="190" y="238">code-enforced burn-redeem</text>
<rect fill="#fcebeb" height="86" rx="8" stroke="#a32d2d" stroke-dasharray="6 4" stroke-width="1.5" width="238" x="392" y="116"></rect>
<text fill="#791f1f" font-size="13" font-weight="500" text-anchor="middle" x="511" y="140">③ Floating USD conversion (reference)</text>
<text fill="#2c2c2a" font-size="11" text-anchor="middle" x="511" y="162">USD = JST×BTC_USD / P<tspan dy="2" font-size="8">floor</tspan></text>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="511" y="180">floats daily with BTC-USD</text>
<text fill="#a32d2d" font-size="11" text-anchor="middle" x="511" y="196">display only, not anchoring</text>
<line marker-end="url(#d4_arr3r)" stroke="#a32d2d" stroke-dasharray="5 3" stroke-width="1.5" x1="300" x2="390" y1="138" y2="148"></line>
<text fill="#a32d2d" font-size="11" text-anchor="middle" x="345" y="130">real-time conversion display</text>
<rect fill="#faeeda" height="72" rx="8" stroke="#854f0b" stroke-width="1.5" width="238" x="392" y="288"></rect>
<text fill="#633806" font-size="12" font-weight="500" text-anchor="middle" x="511" y="312">Wrong: unit directly pegged to floating USD</text>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="511" y="334">inherits BTC-USD fluctuations → anchor fails</text>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="511" y="350">J-ST loses its meaning</text>
</svg>