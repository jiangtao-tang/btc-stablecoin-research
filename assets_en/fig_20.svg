<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="d3_arr2" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#185fa5"></path>
</marker>
</defs>
<text fill="#0c447c" font-size="16" font-weight="600" text-anchor="middle" x="340" y="28">Three-layer architecture of the joule-standard currency</text>
 Layer 1: Physical Substrate 
<rect fill="#eaf3de" height="70" rx="10" stroke="#3b6d11" stroke-width="1.5" width="560" x="60" y="70"></rect>
<text fill="#27500a" font-size="14" font-weight="600" x="100" y="100">L1 Physical Substrate</text>
<text fill="#27500a" font-size="11" x="100" y="120">Energy itself</text>
<text fill="#27500a" font-size="11" x="240" y="100">H: food → metabolic work (≈ 8.4 MJ/day)</text>
<text fill="#27500a" font-size="11" x="240" y="120">A: electric energy → computational work (η × F)</text>
<text fill="#27500a" font-size="10" font-style="italic" x="540" y="110">Objectively exists, needs no consensus</text>
 Layer 2: Unit of Account 
<rect fill="#fff3cd" height="70" rx="10" stroke="#d39e00" stroke-width="1.5" width="560" x="60" y="160"></rect>
<text fill="#6b5400" font-size="14" font-weight="600" x="100" y="190">L2 Unit of Account</text>
<text fill="#6b5400" font-size="11" x="100" y="210">1 joule ≡ 1 joule</text>
<text fill="#6b5400" font-size="11" x="240" y="190">Physical invariant (like seconds, meters, kg)</text>
<text fill="#6b5400" font-size="11" x="240" y="210">η differences are reflected in price, not in the unit</text>
<text fill="#6b5400" font-size="10" font-style="italic" x="540" y="190">Does not attempt to encode η</text>
 Layer 3: Transaction Medium 
<rect fill="#e6f1fb" height="90" rx="10" stroke="#185fa5" stroke-width="1.5" width="560" x="60" y="250"></rect>
<text fill="#0c447c" font-size="14" font-weight="600" x="100" y="280">L3 Transaction Medium</text>
<text fill="#0c447c" font-size="11" x="100" y="300">Any token</text>
<rect fill="#fff" height="30" rx="4" stroke="#185fa5" stroke-width="1" width="80" x="240" y="265"></rect>
<text fill="#0c447c" font-size="11" text-anchor="middle" x="280" y="284">J-ST</text>
<rect fill="#fff" height="30" rx="4" stroke="#185fa5" stroke-width="1" width="80" x="330" y="265"></rect>
<text fill="#0c447c" font-size="11" text-anchor="middle" x="370" y="284">Energy Token</text>
<rect fill="#fff" height="30" rx="4" stroke="#185fa5" stroke-width="1" width="80" x="420" y="265"></rect>
<text fill="#0c447c" font-size="11" text-anchor="middle" x="460" y="284">BTC</text>
<rect fill="#fff" height="30" rx="4" stroke="#185fa5" stroke-width="1" width="100" x="510" y="265"></rect>
<text fill="#0c447c" font-size="11" text-anchor="middle" x="560" y="284">Stablecoin / Fiat</text>
<text fill="#0c447c" font-size="10" text-anchor="middle" x="280" y="316">Joule-anchored</text>
<text fill="#0c447c" font-size="10" text-anchor="middle" x="370" y="316">Physical redemption</text>
<text fill="#0c447c" font-size="10" text-anchor="middle" x="460" y="316">Physical floor</text>
<text fill="#0c447c" font-size="10" text-anchor="middle" x="560" y="316">Floating exchange rate</text>
<!-- Arrows between layers -->
<line marker-end="url(#d3_arr2)" stroke="#185fa5" stroke-width="1.5" x1="200" x2="200" y1="140" y2="158"></line>
<line marker-end="url(#d3_arr2)" stroke="#185fa5" stroke-width="1.5" x1="500" x2="500" y1="230" y2="248"></line>
<text fill="#5f5e5a" font-size="10" font-style="italic" x="220" y="153">L1→L2: Physically measurable</text>
<text fill="#5f5e5a" font-size="10" font-style="italic" x="520" y="243">L2→L3: Floating exchange rate</text>
<text fill="#5f5e5a" font-size="12" font-style="italic" text-anchor="middle" x="340" y="365">Figure 20 Three-layer architecture of the Joule-standard currency: physical substrate → unit of account → transaction medium</text>
</svg>