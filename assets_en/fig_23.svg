<svg role="img" style="font-family:'Segoe UI','Microsoft YaHei',sans-serif" viewBox="0 0 680 460" width="100%">
<title>USD price = marginal energy floor × (1 + speculative premium)</title>
<defs>
<marker id="d4_arrz" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="8" refy="5" viewBox="0 0 10 10">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-width="1.5"></path>
</marker>
</defs>
<text fill="#0c447c" font-size="15" font-weight="500" text-anchor="middle" x="340" y="26">Marginal pricing: USD price = marginal energy floor × (1 + speculative premium)</text>
 Axis 
<line stroke="#9a988f" stroke-width="1" x1="70" x2="640" y1="330" y2="330"></line>
<line stroke="#9a988f" stroke-width="1" x1="70" x2="70" y1="330" y2="70"></line>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="355" y="356">Cycle 1 → 5 (time, log y-axis)</text>
<text fill="#5f5e5a" font-size="10" text-anchor="end" x="58" y="75">High</text>
<text fill="#5f5e5a" font-size="10" text-anchor="end" x="58" y="328">Low</text>
 Marginal floor curve (rising) 
<polyline fill="none" points="110,300 240,265 380,190 510,140 610,120" stroke="#3b6d11" stroke-width="2.5"></polyline>
<circle cx="110" cy="300" fill="#3b6d11" r="3.5"></circle><circle cx="240" cy="265" fill="#3b6d11" r="3.5"></circle>
<circle cx="380" cy="190" fill="#3b6d11" r="3.5"></circle><circle cx="510" cy="140" fill="#3b6d11" r="3.5"></circle>
<circle cx="610" cy="120" fill="#3b6d11" r="3.5"></circle>
<text fill="#3b6d11" font-size="11" font-weight="600" x="612" y="112">Marginal P_floor (energy floor)</text>
 USD price curve (above the floor, more volatile) 
<polyline fill="none" points="110,290 175,255 240,275 305,150 380,210 445,110 510,175 575,95 610,105" stroke="#0c447c" stroke-dasharray="1 0" stroke-width="2.5"></polyline>
<circle cx="110" cy="290" fill="#0c447c" r="3"></circle><circle cx="305" cy="150" fill="#0c447c" r="3"></circle>
<circle cx="445" cy="110" fill="#0c447c" r="3"></circle><circle cx="575" cy="95" fill="#0c447c" r="3"></circle>
<text fill="#0c447c" font-size="11" font-weight="600" x="300" y="140">USD price (with speculative premium)</text>
 Premium band 
<path d="M110,290 L305,150 L445,110 L575,95 L610,105 L610,120 L510,140 L380,190 L240,265 L110,300 Z" fill="#0c447c" fill-opacity="0.06"></path>
<text fill="#854f0b" font-size="11" x="470" y="70">↕ shading = speculative premium (variable, bounded)</text>
 Bottom conclusion 
<rect fill="#fff3cd" height="62" rx="10" stroke="#d39e00" stroke-width="1" width="540" x="70" y="380"></rect>
<text fill="#6b5400" font-size="12" font-weight="500" text-anchor="middle" x="340" y="404">Marginal floor keeps rising (mining gets more expensive); USD price stacks a bounded speculative premium on top</text>
<text fill="#6b5400" font-size="11.5" text-anchor="middle" x="340" y="426">After maturity the market-implied energy price converges to ~5–8×10⁻⁸ USD/J — empirical basis for J-ST anchoring to marginal energy</text>
</svg>