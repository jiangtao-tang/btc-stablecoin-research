<svg role="img" style="font-family:'Segoe UI','Microsoft YaHei',sans-serif" viewBox="0 0 680 420" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>比值 USD/J 收敛曲线：开采价口径收敛于 ~3e-8 窄带，市值口径摆动</title>
<!-- 坐标轴 -->
<line stroke="#9a988f" stroke-width="1" x1="90" x2="90" y1="40" y2="340"></line>
<line stroke="#9a988f" stroke-width="1" x1="90" x2="640" y1="340" y2="340"></line>
<!-- Y 网格 (log: 1e-6 / 1e-7 / 1e-8) -->
<line stroke="#e2e2e2" stroke-width="1" x1="90" x2="640" y1="40" y2="40"></line>
<line stroke="#e2e2e2" stroke-width="1" x1="90" x2="640" y1="190" y2="190"></line>
<line stroke="#e2e2e2" stroke-width="1" x1="90" x2="640" y1="340" y2="340"></line>
<text fill="#5f5e5a" font-size="10" text-anchor="end" x="84" y="44">1e-6</text>
<text fill="#5f5e5a" font-size="10" text-anchor="end" x="84" y="194">1e-7</text>
<text fill="#5f5e5a" font-size="10" text-anchor="end" x="84" y="344">1e-8</text>
<text fill="#5f5e5a" font-size="10" text-anchor="end" x="58" y="30">USD/J（log）</text>
<!-- X 刻度 -->
<text fill="#5f5e5a" font-size="10" text-anchor="middle" x="90" y="358">2010</text>
<text fill="#5f5e5a" font-size="10" text-anchor="middle" x="234" y="358">2014</text>
<text fill="#5f5e5a" font-size="10" text-anchor="middle" x="342" y="358">2017</text>
<text fill="#5f5e5a" font-size="10" text-anchor="middle" x="450" y="358">2020</text>
<text fill="#5f5e5a" font-size="10" text-anchor="middle" x="558" y="358">2023</text>
<text fill="#5f5e5a" font-size="10" text-anchor="middle" x="630" y="358">2025</text>
<!-- 收敛带 (开采价 ~3e-8, ±15%: 2.55e-8~3.45e-8 → y 279~259) 仅 2014 后 -->
<rect fill="#3b6d11" fill-opacity="0.10" height="20" width="396" x="234" y="259"></rect>
<line stroke="#3b6d11" stroke-dasharray="4 3" stroke-width="1" x1="234" x2="234" y1="40" y2="340"></line>
<text fill="#3b6d11" font-size="10" x="240" y="252">2014 起：开采价口径收敛带 ~3×10⁻⁸ ±15%</text>
<!-- 年末市值口径 (蓝, 摆动) -->
<polyline fill="none" points="90,138.9 126,77.3 162,126.3 198,45.9 234,206.8 270,213.0 306,175.5 342,35.0 378,164.5 414,167.8 450,85.6 486,75.9 522,161.9 558,106.9 594,69.5 630,84.8" stroke="#0c447c" stroke-width="2.2"></polyline>
<text fill="#0c447c" font-size="11" font-weight="600" x="300" y="62">年末市值口径（摆动，不收敛）</text>
<!-- 开采价口径 (绿, 贴带) -->
<polyline fill="none" points="90,138.9 126,118.0 162,178.7 198,169.5 234,261.2 270,272.9 306,263.2 342,213.4 378,249.2 414,263.4 450,263.0 486,259.5 522,270.2 558,261.8 594,262.8 630,266.5" stroke="#3b6d11" stroke-width="2.6"></polyline>
<circle cx="234" cy="261.2" fill="#3b6d11" r="3"></circle>
<circle cx="594" cy="262.8" fill="#3b6d11" r="3"></circle>
<text fill="#3b6d11" font-size="11" font-weight="600" x="360" y="300">开采价口径（收敛于窄带）</text>
<rect fill="#eaf3de" height="38" rx="9" stroke="#3b6d11" stroke-width="1" width="540" x="90" y="372"></rect>
<text fill="#27500a" font-size="11.5" font-weight="500" text-anchor="middle" x="360" y="393">储备价值（按开采年价）≈ 常数 × 累积能耗 ⇒ BTC 存量 ≈ 嵌入的总焦耳</text>
</svg>