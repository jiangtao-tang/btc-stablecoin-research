<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="d1_arrF" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4">
<path d="M0,0 L8,4 L0,8 z" fill="#2c5f7c"></path>
</marker>
</defs>
<!-- Layer 0: Free Energy (bottom) -->
<rect fill="#e8f0f5" height="60" rx="10" stroke="#2c5f7c" stroke-width="2" width="600" x="40" y="300"></rect>
<text fill="#2c5f7c" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="340" y="328">自由能 F = E − TS</text>
<text fill="#555" font-family="sans-serif" font-size="12" text-anchor="middle" x="340" y="348">热力学第一/第二定律 · 物理必然 · 不可违反</text>
<!-- Layer 1: Two branches -->
<!-- Left: Computational Work -->
<rect fill="#fef9e7" height="55" rx="8" stroke="#d68910" stroke-width="2" width="250" x="60" y="180"></rect>
<text fill="#d68910" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="185" y="205">计算功 (A↔A)</text>
<text fill="#555" font-family="sans-serif" font-size="11" text-anchor="middle" x="185" y="223">Landauer原理 + P≠NP</text>
<!-- Right: BTC PoW -->
<rect fill="#fdf2f8" height="55" rx="8" stroke="#c0392b" stroke-width="2" width="250" x="370" y="180"></rect>
<text fill="#c0392b" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="495" y="205">BTC PoW (H↔H)</text>
<text fill="#555" font-family="sans-serif" font-size="11" text-anchor="middle" x="495" y="223">SHA-256哈希碰撞 + 算法稀缺</text>
<!-- Arrows to Free Energy -->
<line marker-end="url(#d1_arrF)" stroke="#d68910" stroke-width="2" x1="185" x2="240" y1="235" y2="300"></line>
<line marker-end="url(#d1_arrF)" stroke="#c0392b" stroke-width="2" x1="495" x2="440" y1="235" y2="300"></line>
<!-- Layer 2: Convergence note -->
<rect fill="#eafaf1" height="40" rx="6" stroke="#2d8659" stroke-width="1.5" width="280" x="200" y="120"></rect>
<text fill="#2d8659" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="340" y="145">收敛：两条独立路径 → 同一根基</text>
<!-- Arrows up to convergence -->
<line marker-end="url(#d1_arrF)" stroke="#999" stroke-width="1.5" x1="185" x2="290" y1="180" y2="160"></line>
<line marker-end="url(#d1_arrF)" stroke="#999" stroke-width="1.5" x1="495" x2="390" y1="180" y2="160"></line>
<!-- Layer 3: H<->A interface -->
<rect fill="#f0f1f3" height="50" rx="8" stroke="#2c5f7c" stroke-dasharray="5,3" stroke-width="1.5" width="320" x="180" y="40"></rect>
<text fill="#2c5f7c" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="340" y="62">H↔A 接口：自由能裸传递</text>
<text fill="#555" font-family="sans-serif" font-size="11" text-anchor="middle" x="340" y="80">汇率 = η_A / η_H ≈ 10⁹ （物理常数级）</text>
<!-- Arrow from convergence to interface -->
<line marker-end="url(#d1_arrF)" stroke="#2d8659" stroke-width="2" x1="340" x2="340" y1="120" y2="90"></line>
<!-- Side annotations -->
<text fill="#999" font-family="sans-serif" font-size="10" text-anchor="middle" transform="rotate(-90, 20, 210)" x="20" y="210">Agent路径</text>
<text fill="#999" font-family="sans-serif" font-size="10" text-anchor="middle" transform="rotate(90, 660, 210)" x="660" y="210">人类路径</text>
</svg>