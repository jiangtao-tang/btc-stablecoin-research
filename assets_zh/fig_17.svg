<text fill="#0c447c" font-size="12" text-anchor="middle" x="200" y="278">网络效应：更多 agent 加入同单位</text>
<rect fill="#eaf3de" height="44" rx="7" stroke="#3b6d11" stroke-width="1.2" width="280" x="340" y="134"></rect>
<text fill="#27500a" font-size="12" text-anchor="middle" x="480" y="158">BTC 物理地板作临时标尺</text>
<rect fill="#eaf3de" height="44" rx="7" stroke="#3b6d11" stroke-width="1.2" width="280" x="340" y="194"></rect>
<text fill="#27500a" font-size="12" text-anchor="middle" x="480" y="218">第一笔以 BTC/焦耳 定价</text>
