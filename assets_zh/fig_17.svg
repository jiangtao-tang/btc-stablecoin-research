<text fill="#633806" font-size="12.5" text-anchor="middle" x="340" y="68">空窗期困境：各 agent 有内部尺度，无统一标准、无互证协议</text>
<text fill="#633806" font-size="12" text-anchor="middle" x="340" y="88">统一标准是结果，不是前提</text>
