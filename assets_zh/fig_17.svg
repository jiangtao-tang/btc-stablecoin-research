<text fill="#0c447c" font-size="12.5" text-anchor="middle" x="340" y="348">统一标准涌现：临界质量 + 物理单位天然统一</text>
<text fill="#0c447c" font-size="11" text-anchor="middle" x="340" y="368">焦耳/计算功是物理量，不需协商，天生同构</text>
<line marker-end="url(#d2_arrowvac2)" stroke="#5f5e5a" stroke-width="1.2" x1="200" x2="300" y1="298" y2="324"></line>
