<svg role="img" viewBox="0 0 680 408" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>空窗期第一个定价的启动路径</title>
<defs>
<marker id="d2_arrowvac2" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="8" refy="5" viewBox="0 0 10 10">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<text fill="#0c447c" font-size="15" font-weight="500" text-anchor="middle" x="340" y="26">空窗期第一个定价的启动路径</text>
