<svg role="img" style="font-family:'Segoe UI','Microsoft YaHei',sans-serif" viewBox="0 0 680 380" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>J-ST 计价单位与焦耳锚的二层结构</title>
<desc>锚定焦耳的前提下，计价单位可贴 USD 标签；浮动 USD 只作实时参考显示，不可作为锚。</desc>
<defs>
<marker id="d4_arr3" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="8" refy="5" viewBox="0 0 10 10">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185fa5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="d4_arr3r" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="8" refy="5" viewBox="0 0 10 10">
<path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<text fill="#2c2c2a" font-size="15" font-weight="500" text-anchor="middle" x="340" y="26">计价单位与锚：二层结构</text>
<text fill="#5f5e5a" font-size="12" text-anchor="middle" x="340" y="46">J-ST 锚定焦耳；USD 只是计价标签 / 浮动参考，不承载锚定</text>
<rect fill="#eaf3de" height="72" rx="8" stroke="#3b6d11" stroke-width="1.5" width="250" x="50" y="288"></rect>
<text fill="#27500a" font-size="14" font-weight="500" text-anchor="middle" x="175" y="312">① 物理锚 · 焦耳</text>
<text fill="#2c2c2a" font-size="12" text-anchor="middle" x="175" y="334">P<tspan dy="3" font-size="9">floor</tspan>（边际能量成本）</text>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="175" y="350">由难度 D + 能效 η 派生，链上可证</text>
<rect fill="#e6f1fb" height="78" rx="8" stroke="#185fa5" stroke-width="1.5" width="250" x="50" y="96"></rect>
<text fill="#0c447c" font-size="14" font-weight="500" text-anchor="middle" x="175" y="120">② 计价单位 J-ST</text>
<text fill="#2c2c2a" font-size="12" text-anchor="middle" x="175" y="142">1 J-ST = 1 MJ（可贴 "$" 标签）</text>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="175" y="160">用户只感知此层；价值固定为焦耳</text>
<line marker-end="url(#d4_arr3)" stroke="#185fa5" stroke-width="1.5" x1="175" x2="175" y1="174" y2="286"></line>
<text fill="#185fa5" font-size="11" x="190" y="222">1:1 固定兑换</text>
<text fill="#185fa5" font-size="11" x="190" y="238">代码强制 burn-redeem</text>
<rect fill="#fcebeb" height="86" rx="8" stroke="#a32d2d" stroke-dasharray="6 4" stroke-width="1.5" width="238" x="392" y="116"></rect>
<text fill="#791f1f" font-size="13" font-weight="500" text-anchor="middle" x="511" y="140">③ 浮动 USD 折算（参考）</text>
<text fill="#2c2c2a" font-size="11" text-anchor="middle" x="511" y="162">USD = JST×BTC_USD / P<tspan dy="2" font-size="8">floor</tspan></text>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="511" y="180">随 BTC-USD 每日浮动</text>
<text fill="#a32d2d" font-size="11" text-anchor="middle" x="511" y="196">仅作显示，非锚定</text>
<line marker-end="url(#d4_arr3r)" stroke="#a32d2d" stroke-dasharray="5 3" stroke-width="1.5" x1="300" x2="390" y1="138" y2="148"></line>
<text fill="#a32d2d" font-size="11" text-anchor="middle" x="345" y="130">实时换算显示</text>
<rect fill="#faeeda" height="72" rx="8" stroke="#854f0b" stroke-width="1.5" width="238" x="392" y="288"></rect>
<text fill="#633806" font-size="12" font-weight="500" text-anchor="middle" x="511" y="312">错误：单位直接钉浮动 USD</text>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="511" y="334">继承 BTC-USD 波动 → 锚失效</text>
<text fill="#5f5e5a" font-size="11" text-anchor="middle" x="511" y="350">J-ST 失去意义</text>
</svg>