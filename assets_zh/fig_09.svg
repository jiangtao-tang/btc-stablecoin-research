<svg role="img" viewBox="0 0 680 330" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>同一事件相反外部性符号</title>
<defs>
<marker id="d2_arrow2" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="8" refy="5" viewBox="0 0 10 10"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></marker>
</defs>
<text class="t" fill="#0c447c" font-size="14" font-weight="500" text-anchor="middle" x="340" y="26">同一事件 · 相反外部性符号</text>
<text class="ts" fill="#5f5e5a" text-anchor="middle" x="340" y="46">Agent A 提升 η_A → 其他 agent 持有价值的变化</text>
<rect fill="#e6f1fb" height="46" rx="10" stroke="#185fa5" stroke-width="0.5" width="156" x="262" y="68"></rect>
<text fill="#0c447c" font-size="13" font-weight="500" text-anchor="middle" x="340" y="90">A: η_A ↑</text>
<text fill="#5f5e5a" font-size="10" text-anchor="middle" x="340" y="107">驱动力 s_A · π_A</text>
<path d="M262 91 L120 158" fill="none" marker-end="url(#d2_arrow2)" stroke="#a32d2d" stroke-width="1.5"></path>
<rect fill="#fcebeb" height="92" rx="10" stroke="#a32d2d" stroke-width="0.5" width="200" x="20" y="142"></rect>
<text fill="#791f1f" font-size="13" font-weight="500" text-anchor="middle" x="120" y="168">比特持有者</text>
<text fill="#444441" font-size="12" text-anchor="middle" x="120" y="193">实际价值 − s_A·π_A</text>
<text fill="#a32d2d" font-size="11" text-anchor="middle" x="120" y="215">通胀 · 被稀释</text>
<path d="M418 91 L560 158" fill="none" marker-end="url(#d2_arrow2)" stroke="#3b6d11" stroke-width="1.5"></path>
<rect fill="#eaf3de" height="92" rx="10" stroke="#3b6d11" stroke-width="0.5" width="200" x="460" y="142"></rect>
<text fill="#27500a" font-size="13" font-weight="500" text-anchor="middle" x="560" y="168">焦耳持有者</text>
<text fill="#444441" font-size="12" text-anchor="middle" x="560" y="193">实际价值 + s_A·π_A</text>
<text fill="#3b6d11" font-size="11" text-anchor="middle" x="560" y="215">通缩 · 升值</text>
<text class="t" fill="#0c447c" font-weight="500" text-anchor="middle" x="340" y="272">|s_A · π_A| 相同，符号相反 = 再分配</text>
<text class="ts" fill="#5f5e5a" text-anchor="middle" x="340" y="294">这正是 π(t) vs −π(t) 对偶，在异质 agent 间的涌现</text>
</svg>