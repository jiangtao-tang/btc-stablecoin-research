<text fill="#555" font-family="sans-serif" font-size="12" text-anchor="middle" x="510" y="155">Agent</text>
<!-- H<->H loop -->
<path d="M 120 100 Q 80 60 120 40 Q 220 30 220 100" fill="none" marker-end="url(#d1_arr1)" stroke="#2c5f7c" stroke-width="2"></path>
<text fill="#2c5f7c" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="170" y="25">H↔H</text>
<!-- A<->A loop -->
<path d="M 560 100 Q 600 60 560 40 Q 460 30 460 100" fill="none" marker-end="url(#d1_arr2)" stroke="#d68910" stroke-width="2"></path>
<text fill="#d68910" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="510" y="25">A↔A</text>
<!-- H<->A -->
<line marker-end="url(#d1_arr1)" marker-start="url(#d1_arr1)" stroke="#2d8659" stroke-width="3" x1="220" x2="460" y1="140" y2="140"></line>
<text fill="#2d8659" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="340" y="128">H↔A</text>
<text fill="#2d8659" font-family="sans-serif" font-size="11" text-anchor="middle" x="340" y="162">关键接口</text>
<!-- Bottom labels -->
<text fill="#555" font-family="sans-serif" font-size="11" text-anchor="middle" x="170" y="225">表面货币：法币/信用</text>
<text fill="#555" font-family="sans-serif" font-size="11" text-anchor="middle" x="170" y="242">根基：社会约定</text>
<text fill="#555" font-family="sans-serif" font-size="11" text-anchor="middle" x="340" y="225">表面货币：？</text>
<text fill="#2d8659" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="340" y="242">根基：自由能（统一）</text>
<text fill="#555" font-family="sans-serif" font-size="11" text-anchor="middle" x="510" y="225">表面货币：计算功</text>
<text fill="#555" font-family="sans-serif" font-size="11" text-anchor="middle" x="510" y="242">根基：Landauer + P≠NP</text>
</svg>