<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="d1_arr1" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4">
<path d="M0,0 L8,4 L0,8 z" fill="#2c5f7c"></path>
</marker>
<marker id="d1_arr2" markerheight="8" markerwidth="8" orient="auto" refx="6" refy="4">
<path d="M0,0 L8,4 L0,8 z" fill="#d68910"></path>
</marker>
</defs>
<!-- H node -->
<circle cx="170" cy="140" fill="#e8f0f5" r="50" stroke="#2c5f7c" stroke-width="2.5"></circle>
<text fill="#2c5f7c" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="170" y="135">H</text>
<text fill="#555" font-family="sans-serif" font-size="12" text-anchor="middle" x="170" y="155">人类</text>
<!-- A node -->
<circle cx="510" cy="140" fill="#fef9e7" r="50" stroke="#d68910" stroke-width="2.5"></circle>
