<svg role="img" viewBox="0 0 680 260" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>计量对偶性：比特本位 vs 焦耳本位</title>
<text fill="#0c447c" font-size="15" font-weight="500" text-anchor="middle" x="340" y="24">计量对偶性：同一物理过程，两种账户面相</text>
<rect fill="#fcebeb" height="170" rx="10" stroke="#a32d2d" stroke-width="0.5" width="290" x="40" y="50"></rect>
<text fill="#791f1f" font-size="14" font-weight="500" text-anchor="middle" x="185" y="80">比特本位</text>
<text fill="#444441" font-size="12" text-anchor="middle" x="185" y="110">货币 M_B = F · η</text>
<text fill="#444441" font-size="12" text-anchor="middle" x="185" y="140">η↑ → M_B↑</text>
<text fill="#a32d2d" font-size="13" font-weight="500" text-anchor="middle" x="185" y="170">通胀 +π(t)</text>
<rect fill="#eaf3de" height="170" rx="10" stroke="#3b6d11" stroke-width="0.5" width="290" x="350" y="50"></rect>
<text fill="#27500a" font-size="14" font-weight="500" text-anchor="middle" x="495" y="80">焦耳本位</text>
<text fill="#444441" font-size="12" text-anchor="middle" x="495" y="110">货币 M_J = F</text>
<text fill="#444441" font-size="12" text-anchor="middle" x="495" y="140">η↑ → 1焦耳买更多 bit</text>
<text fill="#3b6d11" font-size="13" font-weight="500" text-anchor="middle" x="495" y="170">通缩 −π(t)</text>
<path d="M330 135 L350 135" stroke="#888780" stroke-dasharray="5 4" stroke-width="1"></path>
<text fill="#5f5e5a" font-size="12" text-anchor="middle" x="340" y="240">|π(t)| 相同，符号相反；通胀与通缩是同一枚硬币的两面</text>
</svg>