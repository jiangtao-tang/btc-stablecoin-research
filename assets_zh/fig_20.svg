<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="d3_arr2" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="9" refy="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#185fa5"></path>
</marker>
</defs>
<text fill="#0c447c" font-size="16" font-weight="600" text-anchor="middle" x="340" y="28">焦耳标准货币三层架构</text>
<!-- Layer 1: 物理基底 -->
<rect fill="#eaf3de" height="70" rx="10" stroke="#3b6d11" stroke-width="1.5" width="560" x="60" y="70"></rect>
<text fill="#27500a" font-size="14" font-weight="600" x="100" y="100">L1 物理基底</text>
<text fill="#27500a" font-size="11" x="100" y="120">能量本身</text>
<text fill="#27500a" font-size="11" x="240" y="100">H: 食物→代谢功（≈8.4 MJ/天）</text>
<text fill="#27500a" font-size="11" x="240" y="120">A: 电能→计算功（η × F）</text>
<text fill="#27500a" font-size="10" font-style="italic" x="540" y="110">客观存在，无须共识</text>
<!-- Layer 2: 计价标准 -->
<rect fill="#fff3cd" height="70" rx="10" stroke="#d39e00" stroke-width="1.5" width="560" x="60" y="160"></rect>
<text fill="#6b5400" font-size="14" font-weight="600" x="100" y="190">L2 计价标准</text>
<text fill="#6b5400" font-size="11" x="100" y="210">1 焦耳 ≡ 1 焦耳</text>
<text fill="#6b5400" font-size="11" x="240" y="190">物理不变量（秒、米、kg 类似）</text>
<text fill="#6b5400" font-size="11" x="240" y="210">η 差异通过价格反映，不通过单位</text>
<text fill="#6b5400" font-size="10" font-style="italic" x="540" y="190">不试图编码 η</text>
<!-- Layer 3: 交易媒介 -->
<rect fill="#e6f1fb" height="90" rx="10" stroke="#185fa5" stroke-width="1.5" width="560" x="60" y="250"></rect>
<text fill="#0c447c" font-size="14" font-weight="600" x="100" y="280">L3 交易媒介</text>
<text fill="#0c447c" font-size="11" x="100" y="300">任意 token</text>
<rect fill="#fff" height="30" rx="4" stroke="#185fa5" stroke-width="1" width="80" x="240" y="265"></rect>
<text fill="#0c447c" font-size="11" text-anchor="middle" x="280" y="284">J-ST</text>
<rect fill="#fff" height="30" rx="4" stroke="#185fa5" stroke-width="1" width="80" x="330" y="265"></rect>
<text fill="#0c447c" font-size="11" text-anchor="middle" x="370" y="284">能源 Token</text>
<rect fill="#fff" height="30" rx="4" stroke="#185fa5" stroke-width="1" width="80" x="420" y="265"></rect>
<text fill="#0c447c" font-size="11" text-anchor="middle" x="460" y="284">BTC</text>
<rect fill="#fff" height="30" rx="4" stroke="#185fa5" stroke-width="1" width="100" x="510" y="265"></rect>
<text fill="#0c447c" font-size="11" text-anchor="middle" x="560" y="284">稳定币 / 法币</text>
<text fill="#0c447c" font-size="10" text-anchor="middle" x="280" y="316">焦耳锚定</text>
<text fill="#0c447c" font-size="10" text-anchor="middle" x="370" y="316">物理赎回</text>
<text fill="#0c447c" font-size="10" text-anchor="middle" x="460" y="316">物理地板</text>
<text fill="#0c447c" font-size="10" text-anchor="middle" x="560" y="316">汇率浮动</text>
<!-- Arrows between layers -->
<line marker-end="url(#d3_arr2)" stroke="#185fa5" stroke-width="1.5" x1="200" x2="200" y1="140" y2="158"></line>
<line marker-end="url(#d3_arr2)" stroke="#185fa5" stroke-width="1.5" x1="500" x2="500" y1="230" y2="248"></line>
<text fill="#5f5e5a" font-size="10" font-style="italic" x="220" y="153">L1→L2：物理可测</text>
<text fill="#5f5e5a" font-size="10" font-style="italic" x="520" y="243">L2→L3：浮动汇率</text>
<text fill="#5f5e5a" font-size="12" font-style="italic" text-anchor="middle" x="340" y="365">图20 焦耳标准货币三层架构：物理基底 → 计价标准 → 交易媒介</text>
</svg>