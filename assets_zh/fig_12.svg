<svg role="img" viewBox="0 0 680 440" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>生产者竞争动态博弈与中心化风险的体制依赖</title>
<defs>
<marker id="ar8" markerheight="6" markerwidth="6" orient="auto-start-reverse" refx="8" refy="5" viewBox="0 0 10 10"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></marker>
</defs>
<text fill="#0c447c" font-size="14" font-weight="500" text-anchor="middle" x="340" y="24">生产者竞争动态博弈 · 中心化风险的体制依赖</text>
<text fill="#0c447c" font-size="12" font-weight="500" x="20" y="50">① 竞争 → 退出 → 供给集中</text>
<text fill="#5f5e5a" font-size="10" x="40" y="70">η 轴（效率）↑ ⇒ 成本 1/η ↓</text>
<rect fill="#eaf3de" height="44" rx="8" stroke="#3b6d11" stroke-width="0.8" width="90" x="40" y="80"></rect>
<text fill="#27500a" font-size="13" font-weight="500" text-anchor="middle" x="85" y="100">A 高η</text>
<text fill="#27500a" font-size="10" text-anchor="middle" x="85" y="118">P_A 低</text>
<rect fill="#f1efe8" height="44" rx="8" stroke="#5f5e5a" stroke-width="0.8" width="90" x="150" y="96"></rect>
<text fill="#444441" font-size="13" font-weight="500" text-anchor="middle" x="195" y="116">B 中η</text>
<text fill="#444441" font-size="10" text-anchor="middle" x="195" y="134">P_B 中</text>
<rect fill="#fcebeb" height="44" rx="8" stroke="#a32d2d" stroke-width="0.8" width="90" x="260" y="112"></rect>
<text fill="#791f1f" font-size="13" font-weight="500" text-anchor="middle" x="305" y="132">C 低η</text>
<text fill="#791f1f" font-size="10" text-anchor="middle" x="305" y="150">P_C 高</text>
<path d="M130 102 C 170 80, 210 100, 240 118" fill="none" marker-end="url(#ar8)" stroke="#3b6d11" stroke-width="1.3"></path>
<text fill="#3b6d11" font-size="9" text-anchor="middle" x="185" y="92">压价夺份额</text>
<path d="M240 134 C 300 150, 380 150, 450 150" fill="none" marker-end="url(#ar8)" stroke="#a32d2d" stroke-dasharray="5 4" stroke-width="1.3"></path>
<text fill="#a32d2d" font-size="9" text-anchor="middle" x="345" y="142">退出 bit 生产</text>
<rect fill="#fcebeb" height="44" rx="8" stroke="#a32d2d" stroke-width="0.6" width="150" x="450" y="128"></rect>
<text fill="#791f1f" font-size="12" font-weight="500" text-anchor="middle" x="525" y="148">份额 s_A → 1</text>
<text fill="#444441" font-size="9" text-anchor="middle" x="525" y="164">供给向最高效集中</text>
<text fill="#0c447c" font-size="12" font-weight="500" x="20" y="208">② 中心化风险：取决于体制（η 距 Landauer 极限）</text>
<rect fill="#eaf3de" height="170" rx="10" stroke="#3b6d11" stroke-width="0.8" width="290" x="40" y="222"></rect>
<text fill="#27500a" font-size="13" font-weight="500" text-anchor="middle" x="185" y="244">增长期：η ≪ η_L</text>
<text fill="#444441" font-size="10" text-anchor="middle" x="185" y="264">逃生阀开启：η 前沿移动</text>
<circle cx="100" cy="300" fill="#eaf3de" r="18" stroke="#3b6d11" stroke-width="0.8"></circle>
<text fill="#27500a" font-size="11" text-anchor="middle" x="100" y="304">A</text>
<circle cx="180" cy="300" fill="#e6f1fb" r="18" stroke="#185fa5" stroke-width="0.8"></circle>
<text fill="#0c447c" font-size="11" text-anchor="middle" x="180" y="304">新</text>
<path d="M118 300 L162 300" fill="none" marker-end="url(#ar8)" stroke="#185fa5" stroke-width="1.3"></path>
<text fill="#0c447c" font-size="9" text-anchor="middle" x="140" y="290">置换</text>
<text fill="#444441" font-size="10" text-anchor="middle" x="185" y="338">集中 = 暂态</text>
<text fill="#444441" font-size="10" text-anchor="middle" x="185" y="356">准入免许可</text>
<text fill="#3b6d11" font-size="12" font-weight="500" text-anchor="middle" x="185" y="378">中心化风险：低</text>
<rect fill="#fcebeb" height="170" rx="10" stroke="#a32d2d" stroke-width="0.8" width="290" x="350" y="222"></rect>
<text fill="#791f1f" font-size="13" font-weight="500" text-anchor="middle" x="495" y="244">收敛期：η ≈ η_L</text>
<text fill="#444441" font-size="10" text-anchor="middle" x="495" y="264">逃生阀关闭：前沿冻结</text>
<circle cx="410" cy="300" fill="#fcebeb" r="18" stroke="#a32d2d" stroke-width="0.8"></circle>
<text fill="#791f1f" font-size="11" text-anchor="middle" x="410" y="304">A</text>
<text fill="#a32d2d" font-size="11" text-anchor="middle" x="448" y="304">锁</text>
<text fill="#444441" font-size="10" text-anchor="middle" x="495" y="338">集中 = 黏滞固化</text>
<text fill="#444441" font-size="10" text-anchor="middle" x="495" y="356">存量固化，无新进入</text>
<text fill="#a32d2d" font-size="12" font-weight="500" text-anchor="middle" x="495" y="378">中心化风险：高</text>
<path d="M330 307 L350 307" fill="none" marker-end="url(#ar8)" stroke="#5f5e5a" stroke-width="1.5"></path>
<text fill="#5f5e5a" font-size="8" text-anchor="middle" x="340" y="296">η↑</text>
</svg>